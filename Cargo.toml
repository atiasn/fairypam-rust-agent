[workspace]
members = [
    "bins/fairypam-agent",
    "bins/fairypam-agent-installer",
    "bins/fairypam-agent-guardian",
    "bins/fairypam-agent-shell",
    "bins/fairypam-win32-worker",
    "crates/fairypam-agent-core",
    "crates/fairypam-agent-guardian-protocol",
    "crates/fairypam-agent-input",
    "crates/fairypam-agent-maa",
    "crates/fairypam-agent-protocol",
    "crates/fairypam-agent-realtime",
    "crates/fairypam-agent-suite",
    "crates/fairypam-agent-transport",
    "crates/fairypam-agent-windows",
]
default-members = [
    "bins/fairypam-agent",
    "bins/fairypam-agent-guardian",
    "bins/fairypam-agent-shell",
    "bins/fairypam-win32-worker",
    "crates/fairypam-agent-core",
    "crates/fairypam-agent-guardian-protocol",
    "crates/fairypam-agent-maa",
    "crates/fairypam-agent-protocol",
    "crates/fairypam-agent-realtime",
    "crates/fairypam-agent-suite",
    "crates/fairypam-agent-transport",
    "crates/fairypam-agent-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.12"
edition = "2021"
publish = false

[workspace.dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ed25519-dalek = "2.2"
