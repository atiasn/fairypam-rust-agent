[package]
name = "fairypam-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
ed25519-dalek.workspace = true
fairypam-agent-core = { path = "../../crates/fairypam-agent-core" }
fairypam-agent-input = { path = "../../crates/fairypam-agent-input" }
fairypam-agent-protocol = { path = "../../crates/fairypam-agent-protocol" }
fairypam-agent-suite = { path = "../../crates/fairypam-agent-suite" }
fairypam-agent-transport = { path = "../../crates/fairypam-agent-transport" }
fairypam-agent-windows = { path = "../../crates/fairypam-agent-windows" }
http = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
time = { version = "0.3", features = ["parsing"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
rcgen = "0.14"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
path = "src/lib.rs"
