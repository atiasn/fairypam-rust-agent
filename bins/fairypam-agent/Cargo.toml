[package]
name = "fairypam-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
e2e-live-input = []
dev-automation = ["dep:fairypam-agent-dev-automation", "fairypam-agent-local-protocol/dev-automation", "fairypam-agent-windows/testbed"]

[dependencies]
fairypam-agent-core = { path = "../../crates/fairypam-agent-core" }
fairypam-agent-input = { path = "../../crates/fairypam-agent-input" }
fairypam-agent-dev-automation = { path = "../../crates/fairypam-agent-dev-automation", optional = true }
fairypam-agent-local-protocol = { path = "../../crates/fairypam-agent-local-protocol" }
fairypam-agent-protocol = { path = "../../crates/fairypam-agent-protocol" }
fairypam-agent-transport = { path = "../../crates/fairypam-agent-transport" }
fairypam-agent-windows = { path = "../../crates/fairypam-agent-windows" }
http = "1"
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "fairypam-agent"
path = "src/main.rs"

[[bin]]
name = "fairypam-live-input-smoke"
path = "src/bin/fairypam-live-input-smoke.rs"
required-features = ["e2e-live-input"]
