[package]
name = "fairypam-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
dev-automation = [
    "dep:fairypam-agent-dev-automation",
    "fairypam-agent-local-client/dev-automation",
    "fairypam-agent-local-protocol/dev-automation",
    "fairypam-agent-windows/dev-automation",
]
e2e-live-input = ["dev-automation"]

[dependencies]
base64.workspace = true
fairypam-agent-core = { path = "../../crates/fairypam-agent-core" }
fairypam-agent-dev-automation = { path = "../../crates/fairypam-agent-dev-automation", optional = true }
fairypam-agent-input = { path = "../../crates/fairypam-agent-input" }
fairypam-agent-local-client = { path = "../../crates/fairypam-agent-local-client" }
fairypam-agent-local-protocol = { path = "../../crates/fairypam-agent-local-protocol" }
fairypam-agent-protocol = { path = "../../crates/fairypam-agent-protocol" }
fairypam-agent-suite = { path = "../../crates/fairypam-agent-suite" }
fairypam-agent-transport = { path = "../../crates/fairypam-agent-transport" }
fairypam-agent-windows = { path = "../../crates/fairypam-agent-windows" }
http = "1"
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
ed25519-dalek.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fairypam-agent"
path = "src/main.rs"

[[bin]]
name = "fairypam-live-input-smoke"
path = "src/bin/fairypam-live-input-smoke.rs"
required-features = ["e2e-live-input"]
