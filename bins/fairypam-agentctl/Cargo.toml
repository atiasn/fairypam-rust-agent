[package]
name = "fairypam-agentctl"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
dev-automation = ["dep:fairypam-agent-dev-automation", "fairypam-agent-local-protocol/dev-automation"]

[dependencies]
fairypam-agent-local-client = { path = "../../crates/fairypam-agent-local-client" }
fairypam-agent-local-protocol = { path = "../../crates/fairypam-agent-local-protocol" }
fairypam-agent-dev-automation = { path = "../../crates/fairypam-agent-dev-automation", optional = true }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "fairypam-agentctl"
path = "src/main.rs"
