[package]
name = "fairypam-agent-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
fairypam-agent-protocol = { path = "../../crates/fairypam-agent-protocol" }
fairypam-agent-suite = { path = "../../crates/fairypam-agent-suite" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

[[bin]]
name = "fairypam-agent-shell"
path = "src/main.rs"
