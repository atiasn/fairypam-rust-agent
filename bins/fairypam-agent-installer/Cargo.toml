[package]
name = "fairypam-agent-installer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
fairypam-agent-local-client = { path = "../../crates/fairypam-agent-local-client" }
fairypam-agent-local-protocol = { path = "../../crates/fairypam-agent-local-protocol" }
fairypam-agent-suite = { path = "../../crates/fairypam-agent-suite" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
