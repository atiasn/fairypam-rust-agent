name: Windows candidate
run-name: "Windows candidate ${{ github.sha }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      previous_validated_candidate_public_commit:
        description: Previous validated candidate public commit or ref
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build unsigned Windows candidate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout mirror snapshot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain.toml | Select-String 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup override set $toolchain
          rustc --version
          cargo --version

      - name: Test and build Rust core
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          bash scripts/tests/test-safe-smoke-mode.sh
          bash scripts/tests/test-package-smoke.sh
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release

      - name: Test and build Tauri UI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location tauri-ui
          npm ci
          Set-Location src-tauri
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          Set-Location ..
          npm run tauri build -- --no-bundle --ci

      - name: Package unsigned candidate
        id: package
        shell: pwsh
        env:
          PREVIOUS_VALIDATED_CANDIDATE_PUBLIC_COMMIT: ${{ inputs.previous_validated_candidate_public_commit }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $base = $null
          $requiresGuiSmoke = $true
          $previous = $env:PREVIOUS_VALIDATED_CANDIDATE_PUBLIC_COMMIT
          if (-not [string]::IsNullOrWhiteSpace($previous)) {
            $resolved = (git rev-parse --verify "$previous^{commit}" 2>$null | Select-Object -First 1)
            if ($LASTEXITCODE -eq 0 -and $resolved -match '^[0-9a-f]{40}$') {
              git merge-base --is-ancestor $resolved HEAD
              if ($LASTEXITCODE -eq 0) {
                $base = $resolved
                $guiImpact = @(git diff --name-only "$base..HEAD" | Where-Object {
                  $_ -match '^(tauri-ui/|src/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|build\.rs$|scripts/package-windows-candidate\.ps1$|\.github/workflows/windows-candidate\.yml$)'
                })
                $requiresGuiSmoke = $guiImpact.Count -gt 0
              }
            }
          }
          $baseOutput = if ($base) { $base } else { 'null' }
          "validated_base_public_commit=$baseOutput" >> $env:GITHUB_OUTPUT
          "requires_gui_smoke=$($requiresGuiSmoke.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $sourceCommit = (Get-Content SOURCE_COMMIT -Raw).Trim()
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'fairypam-agent' |
            Select-Object -ExpandProperty version
          $sourceShort = $sourceCommit.Substring(0, 8)
          $buildId = "$version-dev.$sourceShort.run${{ github.run_id }}"
          ./scripts/package-windows-candidate.ps1 `
            -BuildId $buildId `
            -SourceCommit $sourceCommit `
            -PublicCommit '${{ github.sha }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -ValidatedBasePublicCommit $base `
            -RequiresGuiSmoke:$requiresGuiSmoke `
            -OutputDirectory dist
          "artifact_name=fairypam-agent-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
          "package=$(Get-ChildItem dist/*-portable.zip | Select-Object -ExpandProperty FullName)" >> $env:GITHUB_OUTPUT
          "manifest=$(Resolve-Path dist/candidate-manifest.json)" >> $env:GITHUB_OUTPUT

      - name: Attest candidate provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.manifest }}

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
