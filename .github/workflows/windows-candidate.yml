name: Windows core build
run-name: "Windows core build ${{ github.sha }} #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build non-promotable Windows core artifact
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout mirror snapshot
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain.toml | Select-String 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup override set $toolchain
          rustc --version
          cargo --version

      - name: Test workspace and build release binaries
        shell: pwsh
        env:
          FAIRYPAM_BUILD_ID: public-core-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:FAIRYPAM_BUILD_COMMIT = (Get-Content SOURCE_COMMIT -Raw).Trim()
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --release --locked

      - name: Package non-promotable core build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path dist/core | Out-Null
          Copy-Item target/release/fairypam-agent.exe dist/core/
          Copy-Item target/release/fairypam-agent-guardian.exe dist/core/
          Copy-Item -Recurse profiles dist/core/profiles
          Copy-Item test-profile-root-public-key.hex dist/core/
          $sourceCommit = (Get-Content SOURCE_COMMIT -Raw).Trim()
          $agent = Get-Item dist/core/fairypam-agent.exe
          $guardian = Get-Item dist/core/fairypam-agent-guardian.exe
          $receipt = [ordered]@{
            schema_version = 1
            artifact_class = 'core-build-only'
            promotable = $false
            source_commit = $sourceCommit
            public_commit = '${{ github.sha }}'
            build_id = 'public-core-${{ github.run_id }}-${{ github.run_attempt }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            agent_sha256 = (Get-FileHash $agent -Algorithm SHA256).Hash.ToLowerInvariant()
            agent_size = $agent.Length
            guardian_sha256 = (Get-FileHash $guardian -Algorithm SHA256).Hash.ToLowerInvariant()
            guardian_size = $guardian.Length
          }
          $receipt | ConvertTo-Json | Set-Content -Encoding utf8 dist/core-build-receipt.json
          Compress-Archive -Path dist/core/* -DestinationPath dist/fairypam-agent-core-windows.zip

      - name: Upload non-promotable core artifact
        uses: actions/upload-artifact@v7
        with:
          name: fairypam-agent-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/fairypam-agent-core-windows.zip
            dist/core-build-receipt.json
          if-no-files-found: error
          retention-days: 14
