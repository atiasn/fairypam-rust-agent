name: Windows product candidate
run-name: "Windows product candidate ${{ github.sha }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      enrollment_base_url:
        description: Canonical HTTPS enrollment base URL for this non-promotable candidate
        required: true
        type: string

concurrency:
  group: windows-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  core-validation:
    name: Validate Windows Agent core
    if: github.repository == 'atiasn/fairypam-rust-agent'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain.toml | Select-String 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup override set $toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          save-if: false

      - name: Validate Agent workspace
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

  product-build:
    name: Build and smoke non-promotable Windows product
    needs: core-validation
    if: github.repository == 'atiasn/fairypam-rust-agent'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      FAIRYPAM_BUILD_ID: product-installer-${{ github.run_id }}-${{ github.run_attempt }}
      FAIRYPAM_ENROLLMENT_BASE_URL: ${{ inputs.enrollment_base_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain and NSIS
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain.toml | Select-String 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal
          rustup override set $toolchain
          choco install nsis --yes --no-progress
          $nsisRoot = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisRoot 'makensis.exe') -PathType Leaf)) {
            throw 'Chocolatey did not install makensis.exe in the expected NSIS directory'
          }
          $nsisRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          save-if: false

      - name: Prepare and smoke the pinned official MAA runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:FAIRYPAM_ENROLLMENT_BASE_URL -cne 'https://enroll.fp.atiasn.com') {
            throw 'candidate enrollment URL must match the product-fixed logical endpoint'
          }
          New-Item -ItemType Directory -Force target/downloads, target/runtime-signing | Out-Null
          $lock = Get-Content runtime/maa/maa-runtime.lock.json -Raw | ConvertFrom-Json
          if ($lock.sdk_version -cne '5.12.3' -or $lock.release_asset -cne 'MAA-win-x86_64-v5.12.3.zip') {
            throw 'runtime lock is not the frozen MAA 5.12.3 profile'
          }
          $archive = Join-Path target/downloads $lock.release_asset
          Invoke-WebRequest -Uri $lock.release_url -OutFile $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne $lock.release_sha256) { throw 'official MAA archive hash mismatch' }

          cargo build --release --locked -p fairypam-agent-maa --bin sign-runtime
          $candidateSeed = '0714212e3b4855626f7c8996a3b0bdcad7e4f1fe0b1825323f4c596673808d9a'
          $candidateSeed | & target/release/sign-runtime.exe `
            --lock runtime/maa/maa-runtime.lock.json `
            --manifest target/runtime-signing/maa-runtime.manifest.json `
            --public-key-output target/runtime-signing/public-key.hex
          $runtimePublicKey = (Get-Content target/runtime-signing/public-key.hex -Raw).Trim()
          & scripts/prepare-maa-runtime.ps1 `
            -Archive $archive `
            -Lock runtime/maa/maa-runtime.lock.json `
            -SignedManifest target/runtime-signing/maa-runtime.manifest.json `
            -Output target/maa-runtime
          Copy-Item runtime/maa/THIRD-PARTY-NOTICES.md target/maa-runtime

          $env:FAIRYPAM_MAA_RUNTIME_ROOT_PUBLIC_KEY_HEX = $runtimePublicKey
          cargo build --release --locked `
            -p fairypam-agent `
            -p fairypam-agent-guardian `
            -p fairypam-agent-shell `
            -p fairypam-win32-worker `
            -p fairypam-agent-installer `
            -p fairypam-agent-suite
          & target/release/fairypam-win32-worker.exe `
            --smoke-test target/maa-runtime `
            --runtime-root-public-key $runtimePublicKey

      - name: Build standalone Shell-first NSIS installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $payload = Join-Path $PWD 'target/suite-payload'
          New-Item -ItemType Directory -Force `
            $payload, `
            (Join-Path $payload 'resources/runtime'), `
            (Join-Path $payload 'runtime'), `
            (Join-Path $PWD 'dist') | Out-Null
          Copy-Item target/release/fairypam-agent.exe $payload
          Copy-Item target/release/fairypam-agent-guardian.exe $payload
          Copy-Item target/release/fairypam-agent-shell.exe $payload
          Copy-Item target/release/fairypam-win32-worker.exe $payload
          Copy-Item target/release/fairypam-agent-installer.exe (Join-Path $payload 'resources/runtime')
          Copy-Item target/maa-runtime (Join-Path $payload 'runtime/maa') -Recurse

          $sourceCommit = (Get-Content SOURCE_COMMIT -Raw).Trim()
          $suiteVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          & target/release/fairypam-build-suite.exe `
            --build-id $env:FAIRYPAM_BUILD_ID `
            --source-commit $sourceCommit `
            --suite-version $suiteVersion `
            --built-at ([DateTime]::UtcNow.ToString('o')) `
            --build-origin 'github-actions/windows-candidate.yml' `
            --output (Join-Path $payload 'BUILD-MANIFEST.json') `
            --agent target/release/fairypam-agent.exe `
            --guardian target/release/fairypam-agent-guardian.exe `
            --shell target/release/fairypam-agent-shell.exe `
            --worker target/release/fairypam-win32-worker.exe `
            --runtime-dir target/maa-runtime `
            --helper target/release/fairypam-agent-installer.exe

          $setup = Join-Path $PWD 'dist/fairypam-agent-setup-windows.exe'
          $makensis = (Get-Command makensis.exe).Source
          & $makensis `
            "/DFAIRYPAM_PAYLOAD_ROOT=$payload" `
            "/DFAIRYPAM_OUTFILE=$setup" `
            "/DFAIRYPAM_VERSION=$suiteVersion" `
            installer/windows/installer.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setup -PathType Leaf)) {
            throw 'standalone NSIS build failed'
          }

      - name: Smoke fresh Shell-first product install
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = Resolve-Path dist/fairypam-agent-setup-windows.exe
          $installRoot = 'C:\Program Files\FairyPam'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS setup failed: $($installer.ExitCode)" }
          $current = Get-Content (Join-Path $installRoot 'current.json') -Raw | ConvertFrom-Json
          $versionRoot = Join-Path $installRoot "versions\$($current.build_id)"
          foreach ($path in @(
            (Join-Path $versionRoot 'BUILD-MANIFEST.json'),
            (Join-Path $versionRoot 'fairypam-agent.exe'),
            (Join-Path $versionRoot 'fairypam-agent-guardian.exe'),
            (Join-Path $versionRoot 'fairypam-agent-shell.exe'),
            (Join-Path $versionRoot 'fairypam-win32-worker.exe'),
            (Join-Path $versionRoot 'runtime\maa\THIRD-PARTY-NOTICES.md'),
            (Join-Path $versionRoot 'runtime\maa\active.json'),
            (Join-Path $versionRoot 'runtime\maa\versions\5.12.3\bin\MaaFramework.dll'),
            (Join-Path $installRoot 'resources\runtime\fairypam-agent-installer.exe'),
            (Join-Path $installRoot 'uninstall.exe'),
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'FairyPam.lnk')
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing installed product file: $path" }
          }
          if (@(Get-ChildItem $installRoot -Recurse -File -Filter 'fairypam-agent-tauri-ui.exe').Count -ne 0) {
            throw 'Tauri UI entered the production installation'
          }
          foreach ($taskName in @('FairyPam Agent', 'FairyPam Agent UI')) {
            if (@(Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue).Count -ne 0) {
              throw "forbidden scheduled task found: $taskName"
            }
          }
          foreach ($name in @('fairypam-agent.exe', 'fairypam-agent-guardian.exe', 'fairypam-agent-shell.exe', 'fairypam-win32-worker.exe')) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $versionRoot $name))
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $pe + 92) -ne 2) {
              throw "production executable opens a console window: $name"
            }
          }

      - name: Package product installer receipt
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $artifact = Get-Item dist/fairypam-agent-setup-windows.exe
          $manifest = Get-Item target/suite-payload/BUILD-MANIFEST.json
          $manifestBody = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $enrollmentBaseUrlSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData(
              [Text.Encoding]::UTF8.GetBytes($env:FAIRYPAM_ENROLLMENT_BASE_URL)
            )
          ).ToLowerInvariant()
          [ordered]@{
            schema_version = 1
            artifact_class = 'product-installer'
            promotable = $false
            source_commit = (Get-Content SOURCE_COMMIT -Raw).Trim()
            public_commit = '${{ github.sha }}'
            build_id = $env:FAIRYPAM_BUILD_ID
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            enrollment_base_url_sha256 = $enrollmentBaseUrlSha256
            setup_sha256 = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            setup_size = $artifact.Length
            suite_version = $manifestBody.suite_version
            suite_manifest_sha256 = (Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
            suite_manifest_size = $manifest.Length
            maa_runtime_version = '5.12.3'
            install_mode = 'perMachine'
            state_root = 'C:\ProgramData\FairyPam.Agent\Agent'
            entrypoint = 'FairyPam.lnk -> fairypam-agent-installer.exe --launch-shell'
            layout = @(
              'current.json',
              'versions/<build-id>/BUILD-MANIFEST.json',
              'versions/<build-id>/fairypam-agent.exe',
              'versions/<build-id>/fairypam-agent-guardian.exe',
              'versions/<build-id>/fairypam-agent-shell.exe',
              'versions/<build-id>/fairypam-win32-worker.exe',
              'versions/<build-id>/runtime/maa/versions/5.12.3',
              'resources/runtime/fairypam-agent-installer.exe'
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 dist/product-installer-receipt.json

      - name: Attest product setup provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/fairypam-agent-setup-windows.exe

      - name: Attest product installer receipt provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/product-installer-receipt.json

      - name: Upload non-promotable product installer
        uses: actions/upload-artifact@v7
        with:
          name: fairypam-agent-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/fairypam-agent-setup-windows.exe
            dist/product-installer-receipt.json
          if-no-files-found: error
          retention-days: 14

  verify-product-installer-attestation:
    name: Verify product installer attestation as a consumer
    needs: [core-validation, product-build]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download product installer
        uses: actions/download-artifact@v5
        with:
          name: fairypam-agent-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/verified-product-installer

      - name: Verify product installer provenance as a consumer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $signer = "$env:GITHUB_REPOSITORY/.github/workflows/windows-candidate.yml"
          gh attestation verify dist/verified-product-installer/fairypam-agent-setup-windows.exe --repo $env:GITHUB_REPOSITORY --signer-workflow $signer --deny-self-hosted-runners
          gh attestation verify dist/verified-product-installer/product-installer-receipt.json --repo $env:GITHUB_REPOSITORY --signer-workflow $signer --deny-self-hosted-runners
