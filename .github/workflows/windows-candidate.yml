name: Windows product candidate
run-name: "Windows product candidate ${{ github.sha }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      enrollment_base_url:
        description: Canonical HTTPS enrollment base URL for this non-promotable candidate
        required: true
        type: string

concurrency:
  group: windows-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  tauri-ui:
    name: Build non-promotable Windows product installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6

      - name: Install Node for the Tauri UI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain.toml | Select-String 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup override set $toolchain
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            tauri-ui/src-tauri -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare signed candidate bootstrap
        shell: pwsh
        env:
          FAIRYPAM_ENROLLMENT_BASE_URL: ${{ inputs.enrollment_base_url }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $publicKey = node dotnet/scripts/write-live-test-bootstrap.mjs `
            $env:FAIRYPAM_ENROLLMENT_BASE_URL `
            target/suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FAIRYPAM_BOOTSTRAP_PUBLIC_KEY_HEX=$publicKey" >> $env:GITHUB_ENV

      - name: Test and build the product installer
        shell: pwsh
        env:
          FAIRYPAM_ALLOW_UNSIGNED_CANDIDATE_REPAIR: '1'
          FAIRYPAM_BUILD_ID: product-installer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:FAIRYPAM_BUILD_COMMIT = (Get-Content SOURCE_COMMIT -Raw).Trim()
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked -p fairypam-agent -p fairypam-agent-guardian -p fairypam-agent-installer -p fairypam-agent-suite
          $env:FAIRYPAM_TEST_GUARDIAN_EXE = (Resolve-Path target\release\fairypam-agent-guardian.exe).Path
          $env:FAIRYPAM_GUARDIAN_ENV_SENTINEL = 'must-not-reach-guardian'
          cargo test --locked -p fairypam-agent-input --test windows_guardian_process -- --ignored --exact privilege_limited_guardian_process_starts
          New-Item -ItemType Directory -Force target\suite | Out-Null
          '{"schema_version":0,"promotable":false}' |
            Set-Content -NoNewline -Encoding utf8 target\suite\BUILD-MANIFEST.json
          Push-Location tauri-ui
          try {
            npm ci
            npm run check:security
            npm test -- --run

            Push-Location src-tauri
            try {
              cargo fmt --all -- --check
              cargo test --all-targets --locked
              cargo clippy --all-targets --locked -- -D warnings
            }
            finally {
              Pop-Location
            }

            npm run tauri build -- --no-bundle
            ..\target\release\fairypam-build-suite.exe `
              --patch-tauri-nsis ..\target\release\fairypam-agent-tauri-ui.exe
            $suiteVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            $builtAt = [DateTime]::UtcNow.ToString('o')
            ..\target\release\fairypam-build-suite.exe `
              --build-id $env:FAIRYPAM_BUILD_ID `
              --source-commit $env:FAIRYPAM_BUILD_COMMIT `
              --suite-version $suiteVersion `
              --built-at $builtAt `
              --build-origin 'github-actions/windows-candidate.yml' `
              --output ..\target\suite\BUILD-MANIFEST.json `
              --guardian ..\target\release\fairypam-agent-guardian.exe `
              --gui ..\target\release\fairypam-agent-tauri-ui.exe `
              --bootstrap ..\target\suite\agent-bootstrap.json `
              --bootstrap-signature ..\target\suite\agent-bootstrap.json.sig `
              --helper ..\target\release\fairypam-agent-installer.exe `
              --profiles ..\profiles
            npm run tauri bundle -- --bundles nsis
            npm run check:command-surface
            git diff --exit-code -- src-tauri/Cargo.lock
          }
          finally {
            Pop-Location
          }

      - name: Smoke fresh NSIS product install
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected exactly one NSIS setup executable, found $($setup.Count)" }
          & whoami.exe /groups /fo csv /nh
          $installRoot = 'C:\Program Files\FairyPam'
          $installer = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            $bootstrapHelper = Join-Path $installRoot '.fairypam-installer\payload\resources\runtime\fairypam-agent-installer.exe'
            $requiredPaths = [ordered]@{
              current = Join-Path $installRoot 'current.json'
              versions = Join-Path $installRoot 'versions'
              runtime_helper = Join-Path $installRoot 'resources\runtime\fairypam-agent-installer.exe'
              bootstrap_helper = $bootstrapHelper
            }
            foreach ($entry in $requiredPaths.GetEnumerator()) {
              $exists = Test-Path -LiteralPath $entry.Value
              Write-Host "FairyPam diagnostic path: name=$($entry.Key) exists=$exists path=$($entry.Value)"
            }
            if (Test-Path -LiteralPath $installRoot -PathType Container) {
              try {
                Write-Host "FairyPam installation root SDDL: $((Get-Acl -LiteralPath $installRoot).Sddl)"
              }
              catch {
                Write-Host 'FairyPam installation root exists but its SDDL could not be read.'
              }
              Get-ChildItem -LiteralPath $installRoot -Force -Recurse | ForEach-Object {
                $kind = if ($_.PSIsContainer) { 'directory' } else { 'file' }
                $length = if ($_.PSIsContainer) { 0 } else { $_.Length }
                $relative = [System.IO.Path]::GetRelativePath($installRoot, $_.FullName)
                try {
                  $sddl = (Get-Acl -LiteralPath $_.FullName).Sddl
                }
                catch {
                  $sddl = 'unavailable'
                }
                Write-Host "FairyPam diagnostic tree: kind=$kind relative=$relative length=$length sddl=$sddl"
              }
            }
            else {
              Write-Host 'FairyPam installation root does not exist after failed setup.'
            }
            if (Test-Path -LiteralPath $bootstrapHelper -PathType Leaf) {
              try {
                $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
                $startInfo.FileName = $bootstrapHelper
                $startInfo.UseShellExecute = $false
                $startInfo.ArgumentList.Add('--preflight')
                $startInfo.ArgumentList.Add($installRoot)
                $preflight = [System.Diagnostics.Process]::Start($startInfo)
                $preflight.WaitForExit()
                Write-Host "FairyPam diagnostic preflight: status=completed exit_code=$($preflight.ExitCode)"
                $preflight.Dispose()
              }
              catch {
                Write-Host "FairyPam diagnostic preflight: status=launch_failed hresult=$($_.Exception.HResult) type=$($_.Exception.GetType().FullName)"
              }
            }
            else {
              Write-Host 'FairyPam diagnostic preflight: status=helper_missing'
            }
            $stageNames = @{
              1 = 'sddl'
              2 = 'security-attributes'
              3 = 'create-directory'
              4 = 'pin'
              5 = 'verify'
              6 = 'not-directory'
              7 = 'reparse'
              8 = 'validation'
              9 = 'release'
            }
            $exitCode = [int64]$installer.ExitCode
            $stageId = [math]::Floor($exitCode / 65536)
            $detail = $exitCode % 65536
            $stageName = $stageNames[[int]$stageId]
            if ($null -ne $stageName) {
              throw "NSIS setup failed with exit code $exitCode (stage=$stageName, detail=$detail)"
            }
            throw "NSIS setup failed with exit code $exitCode"
          }
          $current = Get-Content (Join-Path $installRoot 'current.json') -Raw | ConvertFrom-Json
          $versionRoot = Join-Path $installRoot "versions\$($current.build_id)"
          foreach ($path in @(
            (Join-Path $versionRoot 'BUILD-MANIFEST.json'),
            (Join-Path $versionRoot 'fairypam-agent-tauri-ui.exe'),
            (Join-Path $versionRoot 'fairypam-agent-guardian.exe'),
            (Join-Path $versionRoot 'agent-bootstrap.json'),
            (Join-Path $versionRoot 'agent-bootstrap.json.sig'),
            (Join-Path $installRoot 'resources\runtime\fairypam-agent-installer.exe'),
            (Join-Path $installRoot 'uninstall.exe')
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing installed product file: $path" }
          }
          $profiles = Join-Path $versionRoot 'profiles'
          if (-not (Test-Path -LiteralPath $profiles -PathType Container)) { throw "missing installed profiles directory: $profiles" }
          $allowedProductExecutables = @(
            (Join-Path $versionRoot 'fairypam-agent-tauri-ui.exe'),
            (Join-Path $versionRoot 'fairypam-agent-guardian.exe'),
            (Join-Path $installRoot 'resources\runtime\fairypam-agent-installer.exe'),
            (Join-Path $installRoot 'uninstall.exe')
          ) | ForEach-Object { [IO.Path]::GetFullPath($_) }
          foreach ($executable in Get-ChildItem -LiteralPath $installRoot -Recurse -File | Where-Object {
            $_.Extension.ToLowerInvariant() -in @('.exe', '.dll', '.msi', '.ps1', '.bat', '.cmd')
          }) {
            if ($allowedProductExecutables -notcontains $executable.FullName) {
              throw "executable is outside the exact product allowlist: $($executable.FullName)"
            }
          }
          foreach ($taskName in @('FairyPam Agent', 'FairyPam Agent UI')) {
            if (@(Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue).Count -ne 0) {
              throw "forbidden scheduled task found: $taskName"
            }
          }
          $siblingCore = @(Get-CimInstance Win32_Process -Filter "Name = 'fairypam-agent.exe'" | Where-Object {
            $_.ExecutablePath -and $_.ExecutablePath.StartsWith($installRoot, [StringComparison]::OrdinalIgnoreCase)
          })
          if ($siblingCore.Count -ne 0) { throw 'forbidden sibling Core process is running from the product install' }

      - name: Package product installer receipt
        shell: pwsh
        env:
          FAIRYPAM_ENROLLMENT_BASE_URL: ${{ inputs.enrollment_base_url }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected exactly one NSIS setup executable, found $($setup.Count)" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $setup[0] dist/fairypam-agent-setup-windows.exe
          $artifact = Get-Item dist/fairypam-agent-setup-windows.exe
          $manifest = Get-Item target/suite/BUILD-MANIFEST.json
          $manifestBody = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $enrollmentBaseUrlSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData(
              [Text.Encoding]::UTF8.GetBytes($env:FAIRYPAM_ENROLLMENT_BASE_URL)
            )
          ).ToLowerInvariant()
          [ordered]@{
            schema_version = 1
            artifact_class = 'product-installer'
            promotable = $false
            source_commit = (Get-Content SOURCE_COMMIT -Raw).Trim()
            public_commit = '${{ github.sha }}'
            build_id = 'product-installer-${{ github.run_id }}-${{ github.run_attempt }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            enrollment_base_url_sha256 = $enrollmentBaseUrlSha256
            setup_sha256 = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            setup_size = $artifact.Length
            suite_version = $manifestBody.suite_version
            suite_manifest_sha256 = (Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
            suite_manifest_size = $manifest.Length
            install_mode = 'perMachine'
            state_root = 'C:\ProgramData\FairyPam.Agent\Agent'
            layout = @('current.json', 'versions/<build-id>/BUILD-MANIFEST.json', 'versions/<build-id>/fairypam-agent-tauri-ui.exe', 'versions/<build-id>/fairypam-agent-guardian.exe', 'versions/<build-id>/agent-bootstrap.json', 'versions/<build-id>/agent-bootstrap.json.sig', 'versions/<build-id>/profiles/', 'resources/runtime/fairypam-agent-installer.exe')
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 dist/product-installer-receipt.json

      - name: Attest product setup provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/fairypam-agent-setup-windows.exe

      - name: Attest product installer receipt provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/product-installer-receipt.json

      - name: Upload non-promotable product installer
        uses: actions/upload-artifact@v7
        with:
          name: fairypam-agent-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/fairypam-agent-setup-windows.exe
            dist/product-installer-receipt.json
          if-no-files-found: error
          retention-days: 14

  verify-product-installer-attestation:
    name: Verify product installer attestation as a consumer
    needs: tauri-ui
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download product installer
        uses: actions/download-artifact@v5
        with:
          name: fairypam-agent-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/verified-product-installer

      - name: Verify product installer provenance as a consumer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $signer = "$env:GITHUB_REPOSITORY/.github/workflows/windows-candidate.yml"
          gh attestation verify dist/verified-product-installer/fairypam-agent-setup-windows.exe --repo $env:GITHUB_REPOSITORY --signer-workflow $signer --deny-self-hosted-runners
          gh attestation verify dist/verified-product-installer/product-installer-receipt.json --repo $env:GITHUB_REPOSITORY --signer-workflow $signer --deny-self-hosted-runners
