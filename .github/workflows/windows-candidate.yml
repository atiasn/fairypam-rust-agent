name: Windows Agent Cargo CI
run-name: "Windows Agent Cargo CI ${{ github.sha }} #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build Windows Agent
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain.toml | Select-String 'channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup override set $toolchain
          rustc --version
          cargo --version

      - name: Check, test, lint, and build release
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --release --locked
