[package]
name = "fairypam-agent-local-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
dev-automation = ["fairypam-agent-local-protocol/dev-automation"]

[dependencies]
fairypam-agent-local-protocol = { path = "../fairypam-agent-local-protocol" }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"
