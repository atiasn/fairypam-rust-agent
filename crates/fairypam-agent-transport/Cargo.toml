[package]
name = "fairypam-agent-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fairypam-agent-protocol = { path = "../fairypam-agent-protocol" }
fastrand = "2"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["tls-ring"] }
uuid = "1"
x509-parser = { version = "0.18", features = ["verify"] }

[target.'cfg(windows)'.dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
rustls-cng = { version = "0.7", default-features = false, features = ["ring"] }
socket2 = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
] }
yasna = "0.6"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }

[lib]
path = "src/lib.rs"
