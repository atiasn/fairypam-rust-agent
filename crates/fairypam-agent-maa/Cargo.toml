[package]
name = "fairypam-agent-maa"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek.workspace = true
fairypam-agent-core = { path = "../fairypam-agent-core", default-features = false }
fairypam-agent-protocol = { path = "../fairypam-agent-protocol" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
maa-framework = { version = "=1.20.0", default-features = false, features = ["dynamic", "win32"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
