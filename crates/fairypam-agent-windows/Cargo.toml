[package]
name = "fairypam-agent-windows"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
testbed = []

[dependencies]
fairypam-agent-core = { path = "../fairypam-agent-core" }
fairypam-agent-input = { path = "../fairypam-agent-input" }
fairypam-agent-local-protocol = { path = "../fairypam-agent-local-protocol" }
image.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.0"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1", features = ["io-util", "net", "time"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "fairypam-test-window"
path = "src/bin/fairypam-test-window.rs"
required-features = ["testbed"]

[[bin]]
name = "fairypam-agent-testbed"
path = "src/bin/fairypam-test-window.rs"
required-features = ["testbed"]
