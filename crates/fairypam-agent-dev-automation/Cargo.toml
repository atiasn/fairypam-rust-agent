[package]
name = "fairypam-agent-dev-automation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fairypam-agent-local-client = { path = "../fairypam-agent-local-client", features = ["dev-automation"] }
fairypam-agent-local-protocol = { path = "../fairypam-agent-local-protocol", features = ["dev-automation"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

[lib]
path = "src/lib.rs"
