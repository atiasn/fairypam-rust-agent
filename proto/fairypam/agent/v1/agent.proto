syntax = "proto3";

package fairypam.agent.v1;

service AgentControlService {
  rpc ControlTunnel(stream AgentControlEvent) returns (stream HubControlCommand);
}

service AgentFrameService {
  rpc FrameTunnel(stream FramePacket) returns (stream FrameDirective);
}

message SessionRef {
  string agent_id = 1;
  string session_id = 2;
  uint64 generation = 3;
}

message CommandRef {
  SessionRef session = 1;
  string command_id = 2;
  uint64 sequence = 3;
  int64 expires_at_unix_ms = 4;
}

message AttemptRef {
  string task_run_id = 1;
  string attempt_id = 2;
  uint32 contract_version = 3;
  string contract_digest = 4;
}

message TaskCommandRef {
  CommandRef command = 1;
  AttemptRef attempt = 2;
  string payload_digest = 3;
}

message AgentAttemptContractV1 {
  string task_run_id = 1;
  string attempt_id = 2;
  string agent_build_id = 3;
  string profile_id = 4;
  string profile_digest = 5;
  string cleanup_policy = 6;
  uint32 contract_version = 7;
  string contract_digest = 8;
}

enum TaskCommandOutcomeState {
  TASK_COMMAND_OUTCOME_STATE_UNSPECIFIED = 0;
  TASK_COMMAND_OUTCOME_STATE_APPLIED = 1;
  TASK_COMMAND_OUTCOME_STATE_NOT_APPLIED = 2;
  TASK_COMMAND_OUTCOME_STATE_UNCERTAIN = 3;
}

enum TaskAttemptState {
  TASK_ATTEMPT_STATE_UNSPECIFIED = 0;
  TASK_ATTEMPT_STATE_NOT_FOUND = 1;
  TASK_ATTEMPT_STATE_CLAIMED = 2;
  TASK_ATTEMPT_STATE_TARGET_READY = 3;
  TASK_ATTEMPT_STATE_ACTIVE = 4;
  TASK_ATTEMPT_STATE_STOPPING = 5;
  TASK_ATTEMPT_STATE_TERMINAL = 6;
}

enum TaskSideEffectState {
  TASK_SIDE_EFFECT_STATE_UNSPECIFIED = 0;
  TASK_SIDE_EFFECT_STATE_NONE = 1;
  TASK_SIDE_EFFECT_STATE_INTENT_RECORDED = 2;
  TASK_SIDE_EFFECT_STATE_APPLIED = 3;
  TASK_SIDE_EFFECT_STATE_NOT_APPLIED = 4;
  TASK_SIDE_EFFECT_STATE_UNCERTAIN = 5;
}

enum TaskInputState {
  TASK_INPUT_STATE_UNSPECIFIED = 0;
  TASK_INPUT_STATE_RELEASED = 1;
  TASK_INPUT_STATE_ACTIVE = 2;
  TASK_INPUT_STATE_UNKNOWN = 3;
}

enum TaskCaptureState {
  TASK_CAPTURE_STATE_UNSPECIFIED = 0;
  TASK_CAPTURE_STATE_NOT_STARTED = 1;
  TASK_CAPTURE_STATE_RUNNING = 2;
  TASK_CAPTURE_STATE_STOPPED = 3;
  TASK_CAPTURE_STATE_UNKNOWN = 4;
}

enum TaskOwnedTargetState {
  TASK_OWNED_TARGET_STATE_UNSPECIFIED = 0;
  TASK_OWNED_TARGET_STATE_NOT_STARTED = 1;
  TASK_OWNED_TARGET_STATE_RUNNING = 2;
  TASK_OWNED_TARGET_STATE_CLOSED = 3;
  TASK_OWNED_TARGET_STATE_UNKNOWN = 4;
}

message TaskCommandOutcomeV1 {
  AttemptRef attempt = 1;
  string command_id = 2;
  string payload_digest = 3;
  TaskCommandOutcomeState outcome = 4;
  optional uint64 source_frame_sequence = 5;
  optional string error_code = 6;
}

message TaskAttemptReceiptV1 {
  uint32 receipt_version = 1;
  AttemptRef attempt = 2;
  TaskAttemptState attempt_state = 3;
  string last_command_id = 4;
  uint64 last_command_sequence = 5;
  uint64 last_command_generation = 6;
  string last_command_payload_digest = 7;
  TaskSideEffectState side_effect_state = 8;
  string last_side_effect_command_id = 9;
  TaskInputState input_state = 10;
  TaskCaptureState capture_state = 11;
  TaskOwnedTargetState owned_target_state = 12;
  optional bool cleanup_complete = 13;
  optional string error_code = 14;
}

message AgentHello {
  string agent_id = 1;
  string agent_version = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
  string build_commit = 5;
  repeated string installed_profile_ids = 6;
  string suite_build_id = 7;
  bool signed_update_capable = 8;
  string update_publisher = 9;
  string update_cert_thumbprint = 10;
  string last_update_id = 11;
  string last_update_target_build_id = 12;
  string last_update_state = 13;
  string last_update_rollback = 14;
}

message HubHello {
  SessionRef session = 1;
  uint32 heartbeat_interval_ms = 2;
  uint32 max_input_lease_ms = 3;
  uint32 max_frame_bytes = 4;
  uint32 accepted_protocol_minor = 5;
}

message AgentControlEvent {
  oneof payload {
    AgentHello hello = 1;
    Heartbeat heartbeat = 2;
    AgentStatus status = 3;
    CommandAck ack = 4;
    CommandNack nack = 5;
    TargetCandidates target_candidates = 6;
    SafetyEvent safety_event = 7;
  }
}

message HubControlCommand {
  oneof payload {
    HubHello hello = 1;
    EnumerateTargets enumerate_targets = 2;
    LockTarget lock_target = 3;
    StartCapture start_capture = 4;
    StopCapture stop_capture = 5;
    InputLease input_lease = 6;
    PulseAction pulse_action = 7;
    MouseDeltaAction mouse_delta_action = 8;
    WindowPointClickAction window_point_click_action = 9;
    ReleaseAll release_all = 10;
    StopSession stop_session = 11;
    FocusTarget focus_target = 12;
    CloseTarget close_target = 13;
    UpdateDirective update_directive = 14;
    BeginTaskAttempt begin_task_attempt = 15;
    StartTaskTarget start_task_target = 16;
    FinishTaskAttempt finish_task_attempt = 17;
    InspectTaskAttempt inspect_task_attempt = 18;
    LaunchTarget launch_target = 19;
  }
}

message Heartbeat {
  SessionRef session = 1;
  int64 sent_at_unix_ms = 2;
}

message AgentStatus {
  SessionRef session = 1;
  string state = 2;
  string profile_id = 3;
}

message CommandAck {
  CommandRef command = 1;
  string result_json = 2;
  TaskCommandRef task = 3;
  TaskCommandOutcomeV1 task_outcome = 4;
  TaskAttemptReceiptV1 task_attempt_receipt = 5;
}

message CommandNack {
  CommandRef command = 1;
  string error_code = 2;
  string message = 3;
  TaskCommandRef task = 4;
}

message TargetCandidate {
  uint64 hwnd = 1;
  uint32 pid = 2;
  string process_path_sha256 = 3;
  string window_class = 4;
  string title = 5;
}

message TargetCandidates {
  CommandRef command = 1;
  repeated TargetCandidate candidates = 2;
}

message SafetyEvent {
  SessionRef session = 1;
  string reason = 2;
  string state = 3;
  AttemptRef attempt = 4;
}

message BeginTaskAttempt {
  TaskCommandRef task = 1;
  AgentAttemptContractV1 contract = 2;
}

message StartTaskTarget {
  TaskCommandRef task = 1;
}

message FinishTaskAttempt {
  TaskCommandRef task = 1;
}

message InspectTaskAttempt {
  TaskCommandRef task = 1;
}

message LaunchTarget {
  CommandRef command = 1;
  string profile_id = 2;
}

message EnumerateTargets {
  CommandRef command = 1;
  string profile_id = 2;
}

message LockTarget {
  CommandRef command = 1;
  uint64 hwnd = 2;
  uint32 pid = 3;
  string profile_id = 4;
}

message FocusTarget {
  CommandRef command = 1;
}

message CloseTarget {
  CommandRef command = 1;
  uint32 timeout_ms = 2;
}

message UpdateDirective {
  CommandRef command = 1;
  string update_id = 2;
  string target_build_id = 3;
  string suite_version = 4;
  string artifact_url = 5;
  string artifact_token = 6;
  string artifact_sha256 = 7;
  uint64 artifact_size = 8;
  string manifest_sha256 = 9;
}

message StartCapture {
  CommandRef command = 1;
  string source_id = 2;
  uint32 fps = 3;
  string encoding = 4;
  uint32 quality = 5;
  TaskCommandRef task = 6;
}

message StopCapture {
  CommandRef command = 1;
  string source_id = 2;
  TaskCommandRef task = 3;
}

message InputLease {
  CommandRef command = 1;
  uint32 ttl_ms = 2;
  repeated string desired_hold_actions = 3;
  TaskCommandRef task = 4;
}

message PulseAction {
  CommandRef command = 1;
  string action_id = 2;
  optional uint64 source_frame_sequence = 3;
  TaskCommandRef task = 4;
}

message MouseDeltaAction {
  CommandRef command = 1;
  string action_id = 2;
  sint32 delta_x = 3;
  sint32 delta_y = 4;
}

message WindowPointClickAction {
  CommandRef command = 1;
  string action_id = 2;
  float normalized_x = 3;
  float normalized_y = 4;
}

message ReleaseAll {
  CommandRef command = 1;
  string reason = 2;
  TaskCommandRef task = 3;
}

message StopSession {
  CommandRef command = 1;
  string reason = 2;
}

message FramePacket {
  SessionRef session = 1;
  string capture_source_id = 2;
  uint64 frame_sequence = 3;
  int64 captured_at_unix_us = 4;
  uint32 width = 5;
  uint32 height = 6;
  string encoding = 7;
  bytes payload = 8;
  AttemptRef attempt = 9;
}

message FrameDirective {
  SessionRef session = 1;
  string capture_source_id = 2;
  bool enabled = 3;
  uint32 fps = 4;
  string encoding = 5;
  uint32 quality = 6;
}
