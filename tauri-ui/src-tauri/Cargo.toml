[package]
name = "fairypam-agent-tauri-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "fairypam_agent_tauri_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fairypam-agent = { path = "../../bins/fairypam-agent" }
fairypam-agent-core = { path = "../../crates/fairypam-agent-core" }
fairypam-agent-suite = { path = "../../crates/fairypam-agent-suite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"

[dev-dependencies]
fairypam-agent = { path = "../../bins/fairypam-agent", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
