[workspace]

[package]
name = "fairypam-agent-tauri-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "fairypam_agent_tauri_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fairypam-agent-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fairypam-agent-local-client = { path = "../../crates/fairypam-agent-local-client" }
fairypam-agent-local-protocol = { path = "../../crates/fairypam-agent-local-protocol" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["time"] }
tokio-util = { version = "0.7", features = ["rt"] }
