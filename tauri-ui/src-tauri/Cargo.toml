[package]
name = "fairypam-agent-tauri-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "fairypam_agent_tauri_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep the GUI build independent from the privileged Agent workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fairypam-agent-local-client = { path = "../../crates/fairypam-agent-local-client" }
fairypam-agent-local-protocol = { path = "../../crates/fairypam-agent-local-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["sync", "time"] }
