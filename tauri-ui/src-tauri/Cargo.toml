[package]
name = "fairypam-agent-tauri-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "fairypam_agent_tauri_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
fairypam-agent = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
